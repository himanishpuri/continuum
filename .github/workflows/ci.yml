name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      eval_changed: ${{ steps.paths.outputs.eval }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: paths
        with:
          filters: |
            eval:
              - 'prompts/**'
              - 'src/ai/**'
              - 'evals/**'
              - 'lib/agent/**'
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  eval:
    needs: check
    if: needs.check.outputs.eval_changed == 'true'
    runs-on: ubuntu-latest
    env:
      EVAL_GEMINI_API_KEY: ${{ secrets.EVAL_GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - if: env.EVAL_GEMINI_API_KEY != ''
        run: npm run eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/
          if-no-files-found: ignore

  publish-prompts:
    needs: [check, eval]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check.result == 'success' && needs.eval.result != 'failure'
    runs-on: ubuntu-latest
    env:
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - if: env.LANGFUSE_PUBLIC_KEY != '' && env.LANGFUSE_SECRET_KEY != ''
        run: npm run prompts:publish
